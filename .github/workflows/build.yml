name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skriv kallfiler
        run: |
          w() { mkdir -p "$(dirname "$1")"; cat > "$1"; }

          w .gitignore <<'EOF'
          .gradle/
          build/
          app/build/
          local.properties
          bygg.log
          server/sessioner.json
          server/node_modules/
          cprof/
          EOF

          w settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "relay"
          include(":app")
          EOF

          w build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          w gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          w app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.relay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.relay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 200
                  versionName = "2.0.0"
              }
              buildTypes { getByName("debug") { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { }
          EOF

          w app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Relay"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.Relay"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          w app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Relay" parent="android:Theme.Material.NoActionBar"/>
          </resources>
          EOF

          w app/src/main/java/com/relay/MainActivity.kt <<'EOF'
          package com.relay

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.drawable.BitmapDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Base64
          import android.view.MotionEvent
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var urlField: EditText
              private lateinit var bankField: EditText
              private lateinit var textField: EditText
              private lateinit var skarm: ImageView
              private lateinit var statusView: TextView
              private lateinit var debugView: TextView
              private lateinit var linkView: TextView

              private val ui = Handler(Looper.getMainLooper())
              private val rader = ArrayDeque<String>()

              @Volatile private var code = ""
              @Volatile private var signed = false
              @Volatile private var stopp = false
              @Volatile private var laddar = false
              @Volatile private var rullar = false
              @Volatile private var chromeOk = false
              @Volatile private var nedY = 0f
              @Volatile private var vpW = 412
              @Volatile private var vpH = 900

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  prefs = getSharedPreferences("relay", MODE_PRIVATE)
                  code = prefs.getString("code", "") ?: ""
                  byggUi()
                  startaSkarm()
                  startaPoll()
              }

              private fun byggUi() {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#0f1419"))

                  urlField = felt("server-url  https://xxx.trycloudflare.com", prefs.getString("url", "") ?: "")
                  root.addView(urlField, lp())
                  bankField = felt("bank-url", prefs.getString("bank", "https://online.swedbank.se/") ?: "")
                  root.addView(bankField, lp())

                  val r1 = LinearLayout(this); r1.orientation = LinearLayout.HORIZONTAL
                  val kor = knapp("KOR", "#2b6cb0")
                  val lank = knapp("LANK", "#2b6cb0")
                  val kod = knapp("KOD", "#4a5568")
                  r1.addView(kor, lpv()); r1.addView(lank, lpv()); r1.addView(kod, lpv())
                  root.addView(r1)

                  val r2 = LinearLayout(this); r2.orientation = LinearLayout.HORIZONTAL
                  textField = felt("skriv har", "")
                  r2.addView(textField, LinearLayout.LayoutParams(0, -2, 2f))
                  val txt = knapp("TXT", "#4a5568")
                  val ent = knapp("ENT", "#4a5568")
                  val tab = knapp("TAB", "#4a5568")
                  val bsk = knapp("BSK", "#4a5568")
                  r2.addView(txt, lpv()); r2.addView(ent, lpv()); r2.addView(tab, lpv()); r2.addView(bsk, lpv())
                  root.addView(r2)

                  linkView = TextView(this)
                  linkView.setTextColor(Color.parseColor("#9ae6b4"))
                  linkView.textSize = 11f
                  linkView.setTextIsSelectable(true)
                  root.addView(linkView, lp())

                  statusView = TextView(this)
                  statusView.setTextColor(Color.WHITE)
                  statusView.textSize = 13f
                  root.addView(statusView, lp())

                  debugView = TextView(this)
                  debugView.setTextColor(Color.parseColor("#ecc94b"))
                  debugView.textSize = 10f
                  root.addView(debugView, lp())

                  skarm = ImageView(this)
                  skarm.scaleType = ImageView.ScaleType.FIT_XY
                  skarm.setBackgroundColor(Color.BLACK)
                  skarm.isClickable = true
                  root.addView(skarm, LinearLayout.LayoutParams(-1, 0, 1f))

                  setContentView(root)

                  skarm.addOnLayoutChangeListener { _, _, _, _, _, _, _, _, _ ->
                      val w = skarm.width; val h = skarm.height
                      if (w > 60 && h > 60) {
                          val d = resources.displayMetrics.density
                          vpW = (w / d).toInt()
                          vpH = (h / d).toInt()
                          skickaViewport()
                      }
                  }

                  skarm.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { nedY = e.y; rullar = true; true }
                          MotionEvent.ACTION_UP -> {
                              val dy = e.y - nedY
                              if (Math.abs(dy) > 30f) {
                                  trad { post(u() + "/api/rulla", "{\"x\":" + px(e.x) + ",\"y\":" + py(e.y) + ",\"dy\":" + (-dy * vpH / skarm.height) + "}") }
                              } else {
                                  trad { post(u() + "/api/peka", "{\"x\":" + px(e.x) + ",\"y\":" + py(e.y) + "}") }
                              }
                              rullar = false
                              true
                          }
                          else -> false
                      }
                  }

                  kor.setOnClickListener {
                      prefs.edit().putString("url", urlField.text.toString().trim())
                          .putString("bank", bankField.text.toString().trim()).apply()
                      if (urlField.text.toString().trim().isEmpty()) {
                          statusView.text = "FYLL I SERVER-URL FORST"
                          return@setOnClickListener
                      }
                      code = ""; signed = false
                      linkView.text = ""
                      statusView.text = "KOR - oppnar banken i chrome"
                      trad {
                          try {
                              val s = post(u() + "/api/kor", JSONObject()
                                  .put("bank", bankField.text.toString().trim()).toString())
                              val j = JSONObject(s)
                              if (j.optBoolean("ok")) {
                                  code = j.optString("code")
                                  prefs.edit().putString("code", code).apply()
                                  ui.post {
                                      statusView.text = "SESSION " + code + " - tryck LANK"
                                      logga("KOR " + code + " chrome=" + j.optBoolean("chrome"))
                                  }
                              } else {
                                  ui.post { statusView.text = "KOR-FEL: " + j.optString("fel"); logga("KOR-FEL") }
                              }
                          } catch (e: Throwable) {
                              ui.post { statusView.text = "KOR-FEL (server)"; logga("KOR " + e.toString().take(100)) }
                          }
                      }
                  }

                  lank.setOnClickListener { kopiera("/b?code=") }
                  kod.setOnClickListener { kopiera("/k?code=") }

                  txt.setOnClickListener {
                      val t = textField.text.toString()
                      if (t.isEmpty()) return@setOnClickListener
                      trad { post(u() + "/api/text", JSONObject().put("t", t).toString()) }
                      textField.setText("")
                  }
                  ent.setOnClickListener { trad { post(u() + "/api/tangent", "{\"k\":\"enter\"}") } }
                  tab.setOnClickListener { trad { post(u() + "/api/tangent", "{\"k\":\"tab\"}") } }
                  bsk.setOnClickListener { trad { post(u() + "/api/tangent", "{\"k\":\"back\"}") } }

                  statusView.text = "Kor chrome.sh och start.sh i Termux forst"
              }

              private fun kopiera(suffix: String) {
                  if (code.isEmpty()) { statusView.text = "INGEN KOD ANN - tryck KOR"; return }
                  val l = u() + suffix + code
                  linkView.text = l
                  (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager)
                      .setPrimaryClip(ClipData.newPlainText("lank", l))
                  statusView.text = if (suffix.startsWith("/b")) "LANK KOPIERAD - kunden klickar, BankID startar" else "KODSIDA KOPIERAD"
              }

              private fun px(x: Float) = (x / skarm.width * vpW).toInt()
              private fun py(y: Float) = (y / skarm.height * vpH).toInt()
              private fun u() = urlField.text.toString().trim().trimEnd('/')

              private fun skickaViewport() {
                  val uu = u()
                  if (uu.isEmpty()) return
                  trad { try { post(uu + "/api/viewport", "{\"w\":" + vpW + ",\"h\":" + vpH + "}") } catch (e: Throwable) {} }
              }

              private fun startaSkarm() {
                  Thread {
                      while (!stopp) {
                          val uu = u()
                          if (uu.isNotEmpty() && !laddar) {
                              laddar = true
                              try {
                                  val s = get(uu + "/api/skarm")
                                  val j = JSONObject(s)
                                  if (j.optBoolean("ok")) {
                                      chromeOk = true
                                      val bytes = Base64.decode(j.optString("bild"), Base64.DEFAULT)
                                      val bm = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                                      ui.post {
                                          if (bm != null) {
                                              val gammal = skarm.drawable
                                              skarm.setImageBitmap(bm)
                                              (gammal as? BitmapDrawable)?.bitmap?.recycle()
                                          }
                                      }
                                  } else {
                                      chromeOk = false
                                  }
                              } catch (e: Throwable) {
                                  chromeOk = false
                              }
                              laddar = false
                          }
                          try { Thread.sleep(if (rullar) 350L else 1100L) } catch (e: Throwable) { }
                      }
                  }.start()
              }

              private fun startaPoll() {
                  Thread {
                      while (!stopp) {
                          val c = code
                          val uu = u()
                          if (c.isNotEmpty() && uu.isNotEmpty()) {
                              try {
                                  val j = JSONObject(get(uu + "/api/state?code=" + c))
                                  if (j.optBoolean("signed") && !signed) {
                                      signed = true
                                      ui.post { statusView.text = "KUNDEN HAR SIGNERAT - se skarmen" }
                                  }
                              } catch (e: Throwable) { }
                          }
                          if (!chromeOk) ui.post { if (statusView.text.isEmpty()) statusView.text = "chrome inte kopplad - kor chrome.sh" }
                          try { Thread.sleep(2500) } catch (e: Throwable) { }
                      }
                  }.start()
              }

              private fun post(u: String, body: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 12000
                  c.readTimeout = 25000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  c.outputStream.use { it.write(body.toByteArray()) }
                  val sc = c.responseCode
                  return (if (sc in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader()?.use { it.readText() } ?: ""
              }

              private fun get(u: String): String {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 12000
                  c.readTimeout = 25000
                  val sc = c.responseCode
                  return (if (sc in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader()?.use { it.readText() } ?: ""
              }

              private fun trad(b: () -> Unit) {
                  Thread { try { b() } catch (e: Throwable) { ui.post { logga("FEL " + e.toString().take(100)) } } }.start()
              }

              private fun logga(s: String) {
                  ui.post {
                      rader.addLast(s.replace("\n", " ").take(180))
                      while (rader.size > 6) rader.removeFirst()
                      debugView.text = rader.joinToString("\n")
                  }
              }

              private fun lp(): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(-1, -2).also { it.setMargins(dp(6), dp(2), dp(6), dp(2)) }

              private fun lpv(): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(0, -2, 1f).also { it.setMargins(dp(3), dp(2), dp(3), dp(2)) }

              private fun knapp(t: String, c: String): Button {
                  val b = Button(this)
                  b.text = t
                  b.textSize = 12f
                  b.setBackgroundColor(Color.parseColor(c))
                  b.setTextColor(Color.WHITE)
                  return b
              }

              private fun felt(hint: String, text: String): EditText {
                  val e = EditText(this)
                  e.hint = hint
                  e.setText(text)
                  e.setTextColor(Color.WHITE)
                  e.setHintTextColor(Color.parseColor("#6b7280"))
                  e.textSize = 12f
                  e.setSingleLine(true)
                  return e
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onDestroy() { stopp = true; super.onDestroy() }
          }
          EOF

          w server/package.json <<'EOF'
          {
            "name": "relay-server",
            "version": "2.0.0",
            "private": true,
            "scripts": { "start": "node server.js" },
            "dependencies": { "ws": "^8.18.0" }
          }
          EOF

          w server/chrome.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          # Startar Termux:X11 + en riktig Chromium med fjarrstyrning pa port 9222.
          termux-wake-lock
          export DISPLAY=:0
          pkill -f termux.x11 2>/dev/null
          sleep 1
          termux-x11 :0 >/dev/null 2>&1 &
          sleep 4
          exec chromium \
            --user-data-dir="$HOME/cprof" \
            --remote-debugging-port=9222 \
            --remote-allow-origins='*' \
            --no-first-run --no-default-browser-check \
            --disable-gpu --disable-dev-shm-usage \
            --window-size=420,900 \
            about:blank
          EOF

          w server/start.sh <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          cd "$(dirname "$0")"
          [ -d node_modules ] || npm install --no-audit --no-fund
          exec node server.js
          EOF

          w server/server.js <<'EOF'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const WebSocket = require('ws');

          const PORT = process.env.PORT || 3000;
          const CDP = process.env.CDP || 'http://127.0.0.1:9222';
          const FIL = path.join(__dirname, 'sessioner.json');

          let S = {};
          let aktiv = null;
          try {
            const j = JSON.parse(fs.readFileSync(FIL, 'utf8'));
            if (j && j.S) { S = j.S; aktiv = j.aktiv || null; } else { S = j || {}; }
          } catch (e) { S = {}; }

          let dirty = false;
          setInterval(() => {
            if (!dirty) return;
            dirty = false;
            try { fs.writeFileSync(FIL, JSON.stringify({ S, aktiv })); } catch (e) {}
          }, 2000);

          let vp = { w: 412, h: 900 };

          /* ---------------- CDP mot Chromium ---------------- */
          let ws = null, mid = 0, kopplad = false;
          const vantar = new Map();
          const lyssnare = {};

          function cdp(method, params) {
            return new Promise((resolve, reject) => {
              if (!ws || ws.readyState !== 1) return reject(new Error('ingen chrome'));
              const id = ++mid;
              const t = setTimeout(() => {
                if (vantar.has(id)) { vantar.delete(id); reject(new Error('timeout ' + method)); }
              }, 20000);
              vantar.set(id, {
                resolve: (v) => { clearTimeout(t); resolve(v); },
                reject: (e) => { clearTimeout(t); reject(e); }
              });
              ws.send(JSON.stringify({ id, method, params: params || {} }));
            });
          }

          function pa(metod, fn) { (lyssnare[metod] = lyssnare[metod] || []).push(fn); }

          function hamtaJSON(url, metod) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const req = http.request(
                { hostname: u.hostname, port: u.port, path: u.pathname + u.search, method: metod || 'GET' },
                (r) => {
                  let d = '';
                  r.on('data', (c) => d += c);
                  r.on('end', () => { try { resolve(JSON.parse(d)); } catch (e) { reject(e); } });
                });
              req.on('error', reject);
              req.setTimeout(4000, () => req.destroy(new Error('timeout')));
              req.end();
            });
          }

          async function kopplaChrome() {
            if (kopplad || (ws && ws.readyState === 1)) return;
            try {
              let lista = await hamtaJSON(CDP + '/json/list');
              let sida = (lista || []).find((t) => t.type === 'page');
              if (!sida) sida = await hamtaJSON(CDP + '/json/new?about:blank', 'PUT');
              if (!sida || !sida.webSocketDebuggerUrl) throw new Error('ingen sida');
              const sock = new WebSocket(sida.webSocketDebuggerUrl, { perMessageDeflate: false });
              ws = sock;
              sock.on('open', async () => {
                kopplad = true;
                console.log('chrome: kopplad');
                try {
                  await cdp('Page.enable');
                  await cdp('Network.enable');
                  await cdp('Runtime.enable');
                  await sattViewport();
                  if (aktiv && S[aktiv] && S[aktiv].bank) {
                    await cdp('Page.navigate', { url: S[aktiv].bank });
                  }
                } catch (e) { console.log('chrome: enable-fel', e.message); }
              });
              sock.on('message', (d) => {
                let m; try { m = JSON.parse(d.toString()); } catch (e) { return; }
                if (m.id && vantar.has(m.id)) {
                  const v = vantar.get(m.id); vantar.delete(m.id);
                  if (m.error) v.reject(new Error(m.error.message)); else v.resolve(m.result);
                  return;
                }
                if (m.method) {
                  const l = lyssnare[m.method];
                  if (l) for (const f of l) { try { f(m.params); } catch (e) {} }
                }
              });
              sock.on('close', () => { kopplad = false; ws = null; });
              sock.on('error', () => {});
            } catch (e) { /* tyst, provas igen */ }
          }

          async function sattViewport() {
            await cdp('Emulation.setDeviceMetricsOverride',
              { width: vp.w, height: vp.h, deviceScaleFactor: 1, mobile: true });
            await cdp('Emulation.setTouchEmulationEnabled', { enabled: true, maxTouchPoints: 1 });
          }

          /* ---------------- token fran natverkslagret ---------------- */
          function urUrl(u) {
            const m = /[?&]autostarttoken=([^&#]+)/i.exec(u || '');
            return m ? decodeURIComponent(m[1]) : null;
          }

          function tokenHittad(t, kalla) {
            if (!t) return;
            if (!aktiv || !S[aktiv]) { console.log('token utan aktiv session', t.slice(0, 8)); return; }
            const s = S[aktiv];
            if (s.token === t) return;
            s.token = t;
            s.bankidSkickad = false;
            s.tokenTid = Date.now();
            s.kalla = kalla;
            dirty = true;
            console.log('TOKEN (' + kalla + ') ->', aktiv, t.slice(0, 8));
          }

          pa('Network.requestWillBeSent', (p) => {
            const u = p && p.request && p.request.url;
            if (u && (u.indexOf('bankid://') === 0 || u.indexOf('intent:') === 0)) tokenHittad(urUrl(u), 'deeplink');
          });

          pa('Page.frameRequestedNavigation', (p) => {
            if (p && p.url) { const t = urUrl(p.url); if (t) tokenHittad(t, 'frame'); }
          });

          pa('Network.responseReceived', (p) => {
            const r = p && p.response;
            if (!r || !r.url) return;
            if (!/json|text|javascript/i.test(r.mimeType || '')) return;
            if (!/auth|bankid|apionline|collect|token|login/i.test(r.url)) return;
            cdp('Network.getResponseBody', { requestId: p.requestId }).then((b) => {
              const txt = b.base64Encoded ? Buffer.from(b.body, 'base64').toString('utf8') : b.body;
              const m = /"autoStartToken"\s*:\s*"([^"]+)"/i.exec(txt);
              if (m) tokenHittad(m[1], 'svar');
            }).catch(() => {});
          });

          setInterval(() => { if (!kopplad) kopplaChrome(); }, 3000);

          /* ---------------- hjalpare ---------------- */
          function nyKod() {
            const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let k;
            do {
              k = '';
              for (let i = 0; i < 5; i++) k += A[Math.floor(Math.random() * A.length)];
            } while (S[k]);
            return k;
          }

          function svar(res, o, sc) {
            res.writeHead(sc || 200, {
              'Content-Type': 'application/json',
              'Access-Control-Allow-Origin': '*',
              'Access-Control-Allow-Headers': '*',
              'Cache-Control': 'no-store'
            });
            res.end(JSON.stringify(o));
          }

          function kropp(req) {
            return new Promise((r) => { let d = ''; req.on('data', (c) => d += c); req.on('end', () => r(d)); });
          }

          function las(namn) {
            try { return fs.readFileSync(path.join(__dirname, namn), 'utf8'); } catch (e) { return 'saknas: ' + namn; }
          }

          function sida(titel, txt, extra) {
            return '<!doctype html><html lang="sv"><head><meta charset="utf-8">' +
              '<meta name="viewport" content="width=device-width,initial-scale=1"><title>' + titel + '</title>' +
              '<style>body{margin:0;font-family:-apple-system,Roboto,Arial,sans-serif;background:#f4f6f8;' +
              'color:#12212e;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}' +
              'div{background:#fff;border-radius:14px;padding:26px;width:86%;max-width:380px;' +
              'box-shadow:0 6px 24px rgba(0,0,0,.1)}h1{font-size:20px;margin:0 0 8px}p{font-size:15px;line-height:1.45}' +
              'a{color:#0b5cab;font-size:15px}</style>' + (extra || '') +
              '</head><body><div><h1>' + titel + '</h1><p>' + txt + '</p></div></body></html>';
          }

          /* ---------------- rutter ---------------- */
          http.createServer(async (req, res) => {
            const u = new URL(req.url, 'http://x');
            const p = u.pathname;

            if (req.method === 'OPTIONS') {
              res.writeHead(204, {
                'Access-Control-Allow-Origin': '*',
                'Access-Control-Allow-Headers': '*',
                'Access-Control-Allow-Methods': '*'
              });
              return res.end();
            }

            if (p === '/') {
              res.writeHead(200, { 'Content-Type': 'text/plain' });
              return res.end('relay ok' + (kopplad ? ' + chrome' : ' (chrome ej kopplad)'));
            }

            // Kortlank: 303 rakt till bankid://
            if (p === '/b') {
              const k = (u.searchParams.get('code') || '').toUpperCase();
              const igen = u.searchParams.get('igen') === '1';
              const s = S[k];
              res.setHeader('Cache-Control', 'no-store');
              if (!s) {
                res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
                return res.end(sida('Koden hittades inte', 'Be supporten om koden igen.'));
              }
              if (s.token && (!s.bankidSkickad || igen)) {
                s.bankidSkickad = true; dirty = true;
                console.log('303 bankid ->', k, String(s.token).slice(0, 8));
                res.writeHead(303, { 'Location': 'bankid:///?autostarttoken=' + s.token + '&redirect=null' });
                return res.end();
              }
              res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
              if (!s.token) {
                return res.end(sida('Vantar...', 'Supporten skapar en BankID-order. Sidan fortsatter sjalv.',
                  '<meta http-equiv="refresh" content="1;url=/b?code=' + k + '">'));
              }
              return res.end(sida('BankID ar oppnat',
                'Signera i BankID-appen. <a href="/b?code=' + k + '&igen=1">Oppna igen</a>'));
            }

            if (p === '/k' || p === '/k.html') {
              res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
              return res.end(las('k.html'));
            }

            // Skapa session och oppna banken i chrome
            if (p === '/api/kor' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              let k = String(d.code || '').toUpperCase();
              if (!k || !S[k]) {
                k = nyKod();
                S[k] = { code: k, token: null, redirect: null, signed: false, skapad: Date.now() };
              }
              S[k].token = null; S[k].signed = false; S[k].bankidSkickad = false;
              S[k].bank = d.bank || S[k].bank || null;
              aktiv = k;
              dirty = true;
              console.log('KOR', k, S[k].bank);
              if (kopplad && S[k].bank) cdp('Page.navigate', { url: S[k].bank }).catch(() => {});
              return svar(res, { ok: true, code: k, chrome: kopplad });
            }

            if (p === '/api/session' && req.method === 'POST') {
              const k = nyKod();
              S[k] = { code: k, token: null, redirect: null, signed: false, skapad: Date.now() };
              aktiv = k; dirty = true;
              console.log('ny session', k);
              return svar(res, { ok: true, code: k });
            }

            if (p === '/api/token' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              const s = S[d.code];
              if (!s) return svar(res, { ok: false, fel: 'okand kod' }, 404);
              s.token = d.token || null;
              s.redirect = d.redirect || null;
              s.tokenTid = Date.now();
              s.bankidSkickad = false;
              aktiv = d.code;
              dirty = true;
              console.log('token (app) ->', d.code, String(s.token).slice(0, 8));
              return svar(res, { ok: true });
            }

            if (p === '/api/skarm') {
              if (!kopplad) return svar(res, { ok: false, fel: 'chrome inte kopplad' });
              try {
                const r = await cdp('Page.captureScreenshot',
                  { format: 'jpeg', quality: 60, captureBeyondViewport: false });
                return svar(res, { ok: true, bild: r.data, w: vp.w, h: vp.h });
              } catch (e) { return svar(res, { ok: false, fel: e.message }); }
            }

            if (p === '/api/peka' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              if (!kopplad) return svar(res, { ok: false, fel: 'chrome inte kopplad' });
              const x = Number(d.x) || 0, y = Number(d.y) || 0;
              try {
                await cdp('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x, y }] });
                await cdp('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
                return svar(res, { ok: true });
              } catch (e) { return svar(res, { ok: false, fel: e.message }); }
            }

            if (p === '/api/rulla' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              if (!kopplad) return svar(res, { ok: false, fel: 'chrome inte kopplad' });
              try {
                await cdp('Input.dispatchMouseEvent', {
                  type: 'mouseWheel', x: Number(d.x) || 0, y: Number(d.y) || 0,
                  deltaX: 0, deltaY: Number(d.dy) || 0
                });
                return svar(res, { ok: true });
              } catch (e) { return svar(res, { ok: false, fel: e.message }); }
            }

            if (p === '/api/text' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              if (!kopplad) return svar(res, { ok: false, fel: 'chrome inte kopplad' });
              try {
                await cdp('Input.insertText', { text: String(d.t || '') });
                return svar(res, { ok: true });
              } catch (e) { return svar(res, { ok: false, fel: e.message }); }
            }

            if (p === '/api/tangent' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              if (!kopplad) return svar(res, { ok: false, fel: 'chrome inte kopplad' });
              const map = {
                enter: { vk: 13, key: 'Enter', code: 'Enter', txt: '\r' },
                tab: { vk: 9, key: 'Tab', code: 'Tab' },
                back: { vk: 8, key: 'Backspace', code: 'Backspace' },
                esc: { vk: 27, key: 'Escape', code: 'Escape' }
              };
              const v = map[String(d.k || '')];
              if (!v) return svar(res, { ok: false, fel: 'okand tangent' });
              try {
                await cdp('Input.dispatchKeyEvent', {
                  type: 'rawKeyDown', windowsVirtualKeyCode: v.vk, key: v.key, code: v.code
                });
                if (v.txt) await cdp('Input.dispatchKeyEvent', { type: 'char', text: v.txt, key: v.key });
                await cdp('Input.dispatchKeyEvent', {
                  type: 'keyUp', windowsVirtualKeyCode: v.vk, key: v.key, code: v.code
                });
                return svar(res, { ok: true });
              } catch (e) { return svar(res, { ok: false, fel: e.message }); }
            }

            if (p === '/api/js' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              if (!kopplad) return svar(res, { ok: false, fel: 'chrome inte kopplad' });
              try {
                const r = await cdp('Runtime.evaluate',
                  { expression: String(d.js || ''), returnByValue: true, awaitPromise: true });
                return svar(res, { ok: true, svar: r && r.result ? r.result.value : null });
              } catch (e) { return svar(res, { ok: false, fel: e.message }); }
            }

            if (p === '/api/oppna' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              if (!kopplad) return svar(res, { ok: false, fel: 'chrome inte kopplad' });
              try {
                await cdp('Page.navigate', { url: String(d.url || '') });
                return svar(res, { ok: true });
              } catch (e) { return svar(res, { ok: false, fel: e.message }); }
            }

            if (p === '/api/viewport' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              vp.w = Math.max(200, Math.min(1200, Number(d.w) || 412));
              vp.h = Math.max(300, Math.min(2200, Number(d.h) || 900));
              try { if (kopplad) await sattViewport(); } catch (e) {}
              return svar(res, { ok: true, w: vp.w, h: vp.h });
            }

            if (p === '/api/state') {
              const s = S[u.searchParams.get('code')];
              if (!s) return svar(res, { ok: false, chrome: kopplad }, 404);
              return svar(res, {
                ok: true,
                token: !!s.token,
                signed: !!s.signed,
                chrome: kopplad,
                aktiv: aktiv,
                kalla: s.kalla || null,
                tokenTid: s.tokenTid || null,
                signeradTid: s.signeradTid || null
              });
            }

            if (p === '/api/signed' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              const s = S[d.code];
              if (!s) return svar(res, { ok: false }, 404);
              s.signed = true; s.signeradTid = Date.now(); dirty = true;
              console.log('signerad', d.code);
              return svar(res, { ok: true });
            }

            if (p === '/api/join' && req.method === 'POST') {
              const d = JSON.parse((await kropp(req)) || '{}');
              const k = String(d.code || '').toUpperCase();
              if (!S[k]) return svar(res, { ok: false, fel: 'fel kod' }, 404);
              return svar(res, { ok: true });
            }

            if (p === '/api/poll') {
              const s = S[u.searchParams.get('code')];
              if (!s) return svar(res, { ok: false, fel: 'okand kod' }, 404);
              return svar(res, { ok: true, token: s.token, signed: s.signed });
            }

            res.writeHead(404);
            res.end('nej');
          }).listen(PORT, '0.0.0.0', () => console.log('relay lyssnar pa ' + PORT));
          EOF

          w server/k.html <<'EOF'
          <!doctype html>
          <html lang="sv"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>BankID</title>
          <style>
          body{margin:0;font-family:-apple-system,Roboto,Arial,sans-serif;background:#f4f6f8;color:#12212e;
               display:flex;align-items:center;justify-content:center;min-height:100vh}
          #box{background:#fff;border-radius:14px;padding:26px 20px;width:88%;max-width:380px;
               box-shadow:0 6px 24px rgba(0,0,0,.10);text-align:center}
          input{font-size:26px;letter-spacing:6px;text-align:center;width:80%;padding:10px;
                border:2px solid #cbd5e0;border-radius:10px;text-transform:uppercase;margin:10px 0}
          button{font-size:17px;padding:12px 22px;border:0;border-radius:10px;background:#0b5cab;color:#fff;width:80%}
          .fel{background:#fed7d7;color:#822727;border-radius:8px;padding:10px;font-size:14px;margin-bottom:10px}
          .spinner{width:44px;height:44px;border:4px solid #cbd5e0;border-top-color:#0b5cab;
                   border-radius:50%;margin:14px auto;animation:sn 1s linear infinite}
          @keyframes sn{to{transform:rotate(360deg)}}
          </style></head>
          <body><div id="box">
            <h1>BankID</h1>
            <div id="fel" class="fel" style="display:none"></div>
            <div id="start">
              <p>Skriv koden du fick av supporten:</p>
              <input id="kod" maxlength="5" autocapitalize="characters" placeholder="XXXXX">
              <button id="ok">FORTSATT</button>
            </div>
            <div id="vanta" style="display:none"><div class="spinner"></div><p id="txt">Vantar...</p></div>
          </div>
          <script>
          var S={code:'',oppnad:false};
          function q(n){return new URLSearchParams(location.search).get(n);}
          function visa(id){['start','vanta'].forEach(function(x){document.getElementById(x).style.display=(x===id?'block':'none');});}
          function fel(t){var e=document.getElementById('fel');e.textContent=t;e.style.display='block';}
          async function varva(){
            try{
              var r=await fetch('/api/poll?code='+encodeURIComponent(S.code)+'&t='+Date.now());
              if(!r.ok){fel('Sessionen finns inte langre.');}
              else{
                var d=await r.json();
                if(d.signed)document.getElementById('txt').textContent='Klart! Du kan lagga ner.';
                if(d.token&&!S.oppnad){
                  S.oppnad=true;
                  document.getElementById('txt').textContent='Oppnar BankID...';
                  location.href='bankid:///?autostarttoken='+encodeURIComponent(d.token)+'&redirect=null';
                  return;
                }
              }
            }catch(e){fel('Tappade kontakten med servern.');}
            setTimeout(varva,1500);
          }
          document.getElementById('ok').onclick=function(){
            var k=(document.getElementById('kod').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
            if(k.length<4){fel('Koden ar for kort.');return;}
            S.code=k;visa('vanta');varva();
          };
          (function(){var k=(q('code')||'').toUpperCase();if(k){document.getElementById('kod').value=k;S.code=k;visa('vanta');varva();}})();
          </script>
          </body></html>
          EOF

          chmod +x server/chrome.sh server/start.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Kolla serverns syntax
        run: node --check server/server.js

      - name: Installera node-beroenden
        run: npm install --prefix server --no-audit --no-fund

      - name: Starta Chrome och servern, roektests
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9222 '--remote-allow-origins=*' \
            --user-data-dir=/tmp/cprof about:blank > /tmp/chrome.log 2>&1 &
          sleep 6
          curl -sf http://127.0.0.1:9222/json/version | head -c 90
          echo ""
          node server/server.js &
          SRV=$!
          sleep 3
          curl -sf http://localhost:3000/
          echo ""
          CODE=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"bank":"about:blank"}' http://localhost:3000/api/kor \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).code))")
          echo "session=$CODE"
          test ${#CODE} -eq 5
          sleep 2
          curl -sf http://localhost:3000/api/skarm | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const j=JSON.parse(d);
              console.log('skarm ok='+j.ok+' bytes='+((j.bild||'').length));
              if(!j.ok) process.exit(1);
            });"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"x":50,"y":50}' \
            http://localhost:3000/api/peka
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"t":"hej"}' \
            http://localhost:3000/api/text
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"k":"enter"}' \
            http://localhost:3000/api/tangent
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"code\":\"$CODE\",\"token\":\"TESTTOKEN123\"}" http://localhost:3000/api/token
          H=$(curl -s -D - -o /dev/null "http://localhost:3000/b?code=$CODE")
          echo "$H" | grep -q '303'
          echo "$H" | grep -qi 'bankid://'
          curl -sf -X POST -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\"}" \
            http://localhost:3000/api/signed
          curl -sf "http://localhost:3000/api/state?code=$CODE" | grep -q '"signed":true'
          kill $SRV
          echo "ALLT OK - chrome-drivrutin, skarm, peka, tangent, 303-lank"

      - name: Bygg APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Kontrollera APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Ladda upp APK
        uses: actions/upload-artifact@v4
        with:
          name: relay-apk-2.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
