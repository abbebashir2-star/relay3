      - name: bygg
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1
          gradle assembleDebug --no-daemon --stacktrace > bygg.log 2>&1
          RC=$?
          grep -n "^e:" bygg.log || true
          tail -n 30 bygg.log
          if [ "$RC" != "0" ]; then exit "$RC"; fi
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Relay 1.1.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: spara
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -A
          git commit -m "scaffold" || true
          git push || true
